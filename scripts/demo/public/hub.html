<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vital Guardian — Multi-Patient Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vg-ui.css">
<link rel="stylesheet" href="admin.css">
<style>
.hub-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; margin-top: 20px; }
.patient-card {
  background: rgba(17,24,39,0.7); border: 1px solid rgba(255,255,255,0.08);
  border-radius: 12px; padding: 22px; transition: all 0.3s; cursor: pointer;
  position: relative; overflow: hidden;
}
.patient-card:hover { transform: translateY(-3px); border-color: #dca54c; box-shadow: 0 10px 25px rgba(220,165,76,0.15); }
.pt-name  { font-size: 1.15rem; font-weight: 700; color: #fff; margin-bottom: 4px; }
.pt-room  { font-size: 0.78rem; color: #8b9ab7; font-family: 'JetBrains Mono', monospace; }
.pt-risk  { display: inline-block; padding: 4px 9px; border-radius: 4px; font-size: 0.63rem; font-weight: 700; text-transform: uppercase; margin-top: 14px; border: 1px solid; }
.risk-high     { background: rgba(239,68,68,0.15);  color: #ef4444; border-color: rgba(239,68,68,0.3); }
.risk-protocol { background: rgba(220,165,76,0.15); color: #dca54c; border-color: rgba(220,165,76,0.3); }
.risk-stable   { background: rgba(52,211,153,0.15); color: #34d399; border-color: rgba(52,211,153,0.3); }
.btn-cam {
  position: absolute; bottom: 18px; right: 18px;
  background: #34d399; color: #000; border: none; border-radius: 50%;
  width: 38px; height: 38px; display: flex; align-items: center; justify-content: center;
  font-size: 1.1rem; cursor: pointer; transition: 0.2s; box-shadow: 0 0 14px rgba(52,211,153,0.4);
}
.patient-card:hover .btn-cam { transform: scale(1.12); }

/* Nav nurse badge */
.nav-nurse-badge {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 10px; border-radius: 6px;
  border: 1px solid rgba(255,255,255,0.08);
  cursor: pointer; transition: all 0.2s;
}
.nav-nurse-badge:hover { background: rgba(255,255,255,0.05); }
.nav-av {
  width: 28px; height: 28px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.72rem; font-weight: 800; color: #fff; flex-shrink: 0;
}
</style>
<script>
  if (!localStorage.getItem('vg_token')) window.location.href = '/static/login.html';
</script>
</head>
<body>
<div id="navbar">
  <div class="logo-area">
    <div class="pdot"></div>
    <div class="logo-txt">
      <span class="logo-brand">VITAL GUARDIAN</span>
      <span class="logo-sub">Central Monitoring Hub</span>
    </div>
  </div>
  <div class="nav-right" style="display:flex;gap:10px;align-items:center;">
    <!-- Nurse badge with avatar -->
    <div class="nav-nurse-badge" id="nav-nurse-badge" title="Your profile">
      <div class="nav-av" id="hub-nav-av"></div>
      <span id="hub-nav-name" style="font-size:0.78rem;font-weight:600;color:#e2e8f0;"></span>
    </div>
    <a href="/static/history.html" class="btn-ui">📋 Incident Logs</a>
    <a href="/static/admin.html" id="admin-hub-btn" class="btn-ui" style="display:none;color:#dca54c;border-color:rgba(220,165,76,0.4);">⚡ Command Center</a>
    <button onclick="logout()" class="btn-ui" style="color:#ef4444;border-color:rgba(239,68,68,0.3);">Logout</button>
  </div>
</div>

<div style="max-width:1200px;margin:36px auto;padding:0 24px;">
  <div style="display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:24px;">
    <div>
      <h2 style="font-weight:800;font-size:1.7rem;margin:0 0 4px;">Active Ward</h2>
      <p style="color:#8b9ab7;margin:0;font-size:0.88rem;">Select a patient card to bring their CCTV camera feed online.</p>
    </div>
    <div id="hub-skeleton-stats" style="display:flex;gap:16px;">
      <div class="vg-skeleton" style="width:80px;height:40px;border-radius:8px;"></div>
      <div class="vg-skeleton" style="width:80px;height:40px;border-radius:8px;"></div>
    </div>
    <div id="hub-live-stats" style="display:none;display:flex;gap:16px;align-items:center;font-size:0.78rem;color:#8b9ab7;">
      <div><span id="hub-patient-count" style="font-weight:800;font-size:1.1rem;color:#38bdf8;"></span> Patients</div>
      <div><span id="hub-alert-count"   style="font-weight:800;font-size:1.1rem;color:#ef4444;"></span> Alerts today</div>
    </div>
  </div>

  <div class="hub-grid" id="patients-grid">
    <div class="vg-skeleton" style="height:160px;border-radius:12px;"></div>
    <div class="vg-skeleton" style="height:160px;border-radius:12px;"></div>
    <div class="vg-skeleton" style="height:160px;border-radius:12px;"></div>
  </div>
</div>

<script src="vg-ui.js"></script>
<script>
'use strict';
document.addEventListener('DOMContentLoaded', () => {
  const name    = localStorage.getItem('vg_nurse_name') || 'Staff';
  const staffId = localStorage.getItem('vg_staff_id')   || '';
  const av      = VG.avatar(name);

  const navAv   = document.getElementById('hub-nav-av');
  if (navAv) { navAv.textContent = av.initials; navAv.style.background = av.bgColor; }
  const navName = document.getElementById('hub-nav-name');
  if (navName) navName.textContent = name;

  if (staffId === 'admin') document.getElementById('admin-hub-btn').style.display = 'inline-flex';

  loadPatients();
  loadHubStats();
});

function logout() {
  localStorage.clear();
  window.location.href = '/static/login.html';
}

async function loadHubStats() {
  try {
    const data = await VG.fetchJSON('/api/history');
    const today = new Date().toISOString().slice(0, 10);
    const todayCount = data.filter(l => l.timestamp && l.timestamp.startsWith(today)).length;
    document.getElementById('hub-alert-count').textContent = todayCount;
    document.getElementById('hub-skeleton-stats').style.display = 'none';
    document.getElementById('hub-live-stats').style.display = 'flex';
  } catch (_) {}
}

async function loadPatients() {
  try {
    const data = await VG.fetchJSON('/api/patients');
    const grid = document.getElementById('patients-grid');
    grid.innerHTML = '';
    document.getElementById('hub-patient-count').textContent = data.length;

    data.forEach(p => {
      let rClass = 'risk-stable';
      if (p.risk_profile.includes('Fall'))     rClass = 'risk-high';
      if (p.risk_profile.includes('Protocol')) rClass = 'risk-protocol';

      const card = document.createElement('div');
      card.className = 'patient-card';
      card.onclick   = () => window.location.href = `/static/index.html?patient=${p.id}`;
      card.innerHTML = `
        <div class="pt-name">${p.name}</div>
        <div class="pt-room">Room ${p.room} · Age ${p.age}</div>
        <div class="pt-risk ${rClass}">${p.risk_profile}</div>
        <div class="btn-cam">📹</div>`;
      grid.appendChild(card);
    });
  } catch (_) {}
}
</script>
</body>
</html>
