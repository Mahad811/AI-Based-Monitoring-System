<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vital Guardian — Patient History</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vg-ui.css">
<style>
body { display: flex; flex-direction: column; min-height: 100vh; background: #060910; color: #e2e8f0; font-family: 'Inter', sans-serif; }
#navbar {
  display: flex; justify-content: space-between; align-items: center;
  background: rgba(6,9,16,0.85); border-bottom: 1px solid rgba(220,165,76,0.15);
  padding: 14px 28px; box-shadow: 0 1px 0 rgba(220,165,76,0.06), 0 4px 24px rgba(0,0,0,0.3);
}
.logo-area { display: flex; align-items: center; gap: 10px; }
.logo-brand { font-size: 0.88rem; font-weight: 800; letter-spacing: 2.5px; display: block; color: #dca54c; }
.logo-sub { font-size: 0.6rem; color: #8b9ab7; display: block; letter-spacing: 0.8px; }
.pdot { width: 9px; height: 9px; border-radius: 50%; background: #34d399; box-shadow: 0 0 10px #34d399; }

.main-content {
  flex: 1; max-width: 1100px; margin: 0 auto; width: 100%; padding: 40px 20px;
}

.profile-header {
  background: rgba(13,18,32,0.88); border: 1px solid rgba(220,165,76,0.25);
  border-radius: 18px; padding: 30px; margin-bottom: 30px;
  display: flex; justify-content: space-between; align-items: center;
  box-shadow: 0 20px 40px rgba(0,0,0,0.4);
}
.pt-name { font-size: 2.2rem; font-weight: 800; margin-bottom: 5px; color: #fff; }
.pt-info { font-family: 'JetBrains Mono', monospace; color: #8b9ab7; font-size: 0.9rem; }
.pt-risk {
  padding: 8px 16px; border-radius: 8px; font-weight: 700; font-size: 0.85rem;
  border: 1px solid; display: inline-block; text-transform: uppercase; letter-spacing: 1px;
}
.risk-high { background: rgba(239,68,68,0.1); color: #fc6b6b; border-color: rgba(239,68,68,0.25); }
.risk-protocol { background: rgba(220,165,76,0.1); color: #dca54c; border-color: rgba(220,165,76,0.25); }
.risk-stable { background: rgba(52,211,153,0.1); color: #34d399; border-color: rgba(52,211,153,0.25); }

/* Timeline styling */
.timeline {
  position: relative; padding-left: 30px; border-left: 2px solid rgba(255,255,255,0.1);
  margin-top: 30px;
}
.timeline-item {
  position: relative; margin-bottom: 30px; padding: 20px;
  background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08);
  border-radius: 12px; transition: transform 0.2s, background 0.2s;
}
.timeline-item:hover { transform: translateX(5px); background: rgba(255,255,255,0.05); }
.timeline-dot {
  position: absolute; left: -37px; top: 25px; width: 12px; height: 12px;
  border-radius: 50%; background: #dca54c; border: 2px solid #060910;
  box-shadow: 0 0 10px rgba(220,165,76,0.5);
}
.tl-time { font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; color: #8b9ab7; margin-bottom: 8px; }
.tl-title { font-size: 1.1rem; font-weight: 700; color: #fff; margin-bottom: 10px; }
.tl-desc { font-size: 0.9rem; color: #cbd5e1; line-height: 1.5; }
.tl-badge {
  display: inline-block; padding: 3px 8px; border-radius: 4px;
  font-size: 0.7rem; font-weight: 700; margin-right: 8px;
  background: rgba(255,255,255,0.1); color: #fff;
}
.tl-badge.alert { background: rgba(239,68,68,0.2); color: #fc6b6b; }
.tl-badge.med { background: rgba(56,189,248,0.2); color: #38bdf8; }
.tl-badge.obs { background: rgba(139,92,246,0.2); color: #c084fc; }
</style>
</head>
<body>
<div id="navbar">
  <div class="logo-area">
    <div class="pdot"></div>
    <div class="logo-txt">
      <span class="logo-brand">VITAL GUARDIAN</span>
      <span class="logo-sub">Comprehensive Patient Record</span>
    </div>
  </div>
  <div class="nav-right">
    <a href="/static/hub.html" class="vg-btn vg-btn-sm" style="background:rgba(255,255,255,0.05);color:#e2e8f0;border-color:rgba(255,255,255,0.12);text-decoration:none;">🔙 Back to Hub</a>
  </div>
</div>

<div class="main-content">
  <div id="loading" style="text-align:center; padding:50px; color:#8b9ab7;">Loading patient profile...</div>
  
  <div id="patient-content" style="display:none;">
    <div class="profile-header">
      <div>
        <div class="pt-name" id="p-name">Patient Name</div>
        <div class="pt-info"><span id="p-room">Room</span> • Age <span id="p-age">0</span> • Admitted 48 hours ago</div>
      </div>
      <div>
        <div id="p-risk" class="pt-risk risk-stable">Stable</div>
      </div>
    </div>
    
    <h3 style="font-size:1.4rem; font-weight:800; border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:15px; margin-bottom:20px;">Clinical Timeline (Past 24h)</h3>
    <div class="timeline" id="timeline-container">
      <!-- Generated by JS -->
    </div>
  </div>
</div>

<script src="vg-ui.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const params = new URLSearchParams(window.location.search);
  const patientId = params.get('patient');
  
  if (!patientId) {
    window.location.href = '/static/hub.html';
    return;
  }
  
  try {
    const patients = await VG.fetchJSON('/api/patients');
    const p = patients.find(x => x.id == patientId);
    
    if (!p) throw new Error("Patient not found");
    
    document.getElementById('loading').style.display = 'none';
    document.getElementById('patient-content').style.display = 'block';
    
    document.getElementById('p-name').textContent = p.name;
    document.getElementById('p-room').textContent = `Room ${p.room}`;
    document.getElementById('p-age').textContent = p.age;
    
    const riskEl = document.getElementById('p-risk');
    riskEl.textContent = p.risk_profile || 'Stable';
    if ((p.risk_profile || '').includes('Fall')) riskEl.className = 'pt-risk risk-high';
    else if ((p.risk_profile || '').includes('Protocol')) riskEl.className = 'pt-risk risk-protocol';
    
    generateTimeline(p);
    
  } catch (err) {
    document.getElementById('loading').textContent = 'Error loading patient data. Please return to the Hub.';
  }
});

function generateTimeline(p) {
  const container = document.getElementById('timeline-container');
  let events = [];
  const now = new Date();
  
  const formatTime = (hoursAgo, minsAgo) => {
    let d = new Date(now.getTime() - (hoursAgo * 60 + minsAgo) * 60000);
    return d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) + ' • ' + d.toLocaleDateString();
  };

  const risk = (p.risk_profile || '').toLowerCase();

  if (risk.includes('fall')) {
    events = [
      { time: formatTime(0, 45), type: 'alert', title: 'Fall Risk Alert Generated', desc: 'Patient attempted to exit bed unassisted. Audio analysis detected rustling and movement. Nurse dispatched immediately. Patient was assisted back to resting position.' },
      { time: formatTime(3, 10), type: 'med', title: 'Medication Administered', desc: 'Administered 50mg Metoprolol orally as prescribed for hypertension. Vitals stable.' },
      { time: formatTime(8, 0), type: 'obs', title: 'Routine Check', desc: 'Patient resting comfortably. Bed rails secured. Call button placed within reach. Fall risk assessment score updated.' },
      { time: formatTime(14, 30), type: 'alert', title: 'Bed Exit Alarm Triggered', desc: 'Pressure sensor on bed indicated patient weight shift towards the edge. Staff intervened before patient could stand. Educated patient on using call bell.' }
    ];
  } else if (risk.includes('epilepsy') || risk.includes('protocol')) {
    events = [
      { time: formatTime(1, 15), type: 'alert', title: 'Seizure Protocol Activated', desc: 'AI Vision model detected rhythmic limb movements. Confidence score 94%. Automatic seizure alert triggered. Staff administered 2mg Lorazepam IV.' },
      { time: formatTime(1, 30), type: 'obs', title: 'Post-Ictal Observation', desc: 'Patient in post-ictal state. Breathing steadily but unresponsive to verbal commands. Oxygen saturation at 96% on room air. Continued continuous EEG monitoring.' },
      { time: formatTime(6, 20), type: 'med', title: 'Routine Anticonvulsant', desc: 'Administered Levetiracetam 500mg IV over 15 minutes. No adverse reactions noted.' },
      { time: formatTime(12, 0), type: 'obs', title: 'Neurological Check', desc: 'Patient alert and oriented x3. PERRLA intact. Motor strength 5/5 in all extremities. No further seizure activity noted since morning.' }
    ];
  } else if (risk.includes('whooping')) {
    events = [
      { time: formatTime(0, 20), type: 'alert', title: 'Severe Coughing Fit', desc: 'Auditory watchdog detected prolonged coughing with characteristic inspiratory "whoop". Audio confidence 98%. Supplemental O2 provided via nasal cannula.' },
      { time: formatTime(2, 45), type: 'med', title: 'Antibiotic Therapy', desc: 'Administered Azithromycin 10mg/kg IV dose. Hydration fluids running at 60mL/hr.' },
      { time: formatTime(5, 10), type: 'obs', title: 'Respiratory Assessment', desc: 'Auscultation reveals scattered rhonchi clearing with cough. SpO2 94% on room air. Parent present at bedside providing comfort.' }
    ];
  } else if (risk.includes('asthma')) {
    events = [
      { time: formatTime(0, 10), type: 'alert', title: 'Respiratory Distress Detected', desc: 'Audio AI detected audible wheezing and increased respiratory rate. AI cross-verification confirmed distress pattern. Nebulizer treatment initiated immediately.' },
      { time: formatTime(1, 0), type: 'med', title: 'Bronchodilator Administered', desc: 'Albuterol/Ipratropium nebulizer treatment completed. Patient reports subjective improvement in dyspnea.' },
      { time: formatTime(4, 30), type: 'obs', title: 'Physician Assessment', desc: 'Pulmonologist evaluated patient. Peak flow improved from 150 L/min to 280 L/min. Adjusted maintenance inhaler dosage.' }
    ];
  } else {
    // Stable
    events = [
      { time: formatTime(2, 0), type: 'obs', title: 'Routine Vitals Check', desc: 'BP 120/80, HR 72, RR 16, Temp 98.6°F. Patient resting quietly. Denies pain or discomfort.' },
      { time: formatTime(7, 30), type: 'med', title: 'Morning Medications', desc: 'Administered daily multivitamin and prophylactic low-dose aspirin.' },
      { time: formatTime(12, 0), type: 'obs', title: 'Dietary', desc: 'Patient tolerated regular diet breakfast well (100% consumed). Good fluid intake.' }
    ];
  }

  let html = '';
  events.forEach(e => {
    let dotColor = '#dca54c';
    if (e.type === 'alert') dotColor = '#fc6b6b';
    if (e.type === 'med') dotColor = '#38bdf8';
    if (e.type === 'obs') dotColor = '#c084fc';
    
    let badge = '';
    if (e.type === 'alert') badge = '<span class="tl-badge alert">AI ALERT</span>';
    if (e.type === 'med') badge = '<span class="tl-badge med">MEDICATION</span>';
    if (e.type === 'obs') badge = '<span class="tl-badge obs">CLINICAL NOTE</span>';

    html += `
      <div class="timeline-item">
        <div class="timeline-dot" style="background:${dotColor}; box-shadow:0 0 10px ${dotColor}80; border-color:#060910;"></div>
        <div class="tl-time">${e.time}</div>
        <div class="tl-title">${badge} ${e.title}</div>
        <div class="tl-desc">${e.desc}</div>
      </div>
    `;
  });
  
  container.innerHTML = html;
}
</script>
</body>
</html>
