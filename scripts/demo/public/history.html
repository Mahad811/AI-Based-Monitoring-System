<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vital Guardian — Incident Logs</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
<script>
    if (!localStorage.getItem('vg_token')) window.location.href = '/static/login.html';
</script>
</head>
<body>
    <div id="navbar">
        <div class="logo-area">
            <div class="pdot"></div>
            <div class="logo-txt">
                <span class="logo-brand">VITAL GUARDIAN</span>
                <span class="logo-sub">Clinical Log History</span>
            </div>
        </div>
        <div class="nav-right">
            <a href="/static/hub.html" class="btn-ui">🔙 Back to Hub</a>
        </div>
    </div>

    <div style="max-width: 1200px; margin: 40px auto; padding: 0 20px;">
        <div class="glass-card table-card" style="width: 100%; box-sizing: border-box;">
            <h2>AI Verified Incidents</h2>
            <div class="table-wrapper">
                <table id="roster-table">
                    <thead>
                        <tr>
                            <th>Log ID</th>
                            <th>Timestamp</th>
                            <th>Patient Name</th>
                            <th>Location</th>
                            <th>Event Type</th>
                            <th>Confidence</th>
                        </tr>
                    </thead>
                    <tbody id="history-body">
                        <!-- Loaded by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        async function loadHistory() {
            try {
                const res = await fetch('/api/history');
                const data = await res.json();
                
                const tbody = document.getElementById('history-body');
                tbody.innerHTML = '';
                
                data.forEach(log => {
                    const cColor = log.incident_type === 'fall' ? '#ef4444' : '#dca54c';
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td style="color:#8b9ab7;">#${log.id}</td>
                        <td style="font-family:'JetBrains Mono';">${log.timestamp}</td>
                        <td style="font-weight:700;">${log.patient_name}</td>
                        <td>${log.room}</td>
                        <td style="color:${cColor}; font-weight:800; text-transform: uppercase;">[ ${log.incident_type} ]</td>
                        <td>${(log.confidence * 100).toFixed(1)}%</td>
                    `;
                    tbody.appendChild(tr);
                });
                
                if (data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding:30px; color:#8b9ab7;">No incidents recorded in the database yet.</td></tr>`;
                }
            } catch (e) {
                console.error(e);
            }
        }
        
        loadHistory();
    </script>
</body>
</html>
